name: is_conversation_vocabulary
description: >-
  An external chat conversation, both ways: what a person said in it and
  what became of that message, and a reply posted back into it (where it
  goes, what it says, the id it was posted under), with their JSON.
version: 0.2.0
repository: https://github.com/intersyntactic/conversation_vocabulary

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.3.0
  is_shapes: ^0.6.0
  is_web_address_vocabulary: ^0.1.2

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.33.0
